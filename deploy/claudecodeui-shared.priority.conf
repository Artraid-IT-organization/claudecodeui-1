# Приоритет сервера сайта Claude UI над всем остальным на сервере (22.09.26).
# Установка (нужен пароль администратора):
#   sudo cp deploy/claudecodeui-shared.priority.conf /etc/systemd/system/claudecodeui-shared.service.d/10-priority.conf
#   sudo systemctl daemon-reload        (без перезапуска — применяется на лету)
#
# MemoryLow — запас памяти, который ядро у сервера не отбирает, пока может
#   отобрать у других (сам сервер ~100–300 МБ; агенты вынесены в
#   ccui-agents.slice, см. server/.../agent-rooms.js).
# IOWeight — первым к диску (по умолчанию у всех 100).
# CPUWeight=250 уже стоит в cpu.conf.
# OOMScoreAdjust намеренно не ставим: его наследуют агенты и их ffmpeg.
[Service]
MemoryLow=512M
IOWeight=500
